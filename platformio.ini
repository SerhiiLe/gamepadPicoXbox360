[env:raspberry-pi-pico]
; Використовуємо стабільний репозиторій-бекап платформи wizio-pico
platform = https://github.com/maxgerhardt/wizio-pico.git
board = raspberry-pi-pico
framework = baremetal

; Налаштування збірки для активації нативного USB-стеку TinyUSB
build_flags = 
    ; Активація бібліотеки USB-пристрою з нативного Pico SDK
    -D LIB_TINYUSB_DEVICE
    ; Налаштування архітектури мікроконтролера
    -D CFG_TUSB_MCU=OPT_MCU_RP2040
    ; Встановлення стандартного розміру Control Endpoint
    -D CFG_TUD_ENDPOINT0_SIZE=64

;monitor_port = SERIAL_PORT
;monitor_speed = 115200

lib_deps =
    https://github.com/hathach/tinyusb.git

; Вказуємо збірщику, де шукати вихідні .pio файли для трансляції
board_build.pio = src/ws2812.pio
